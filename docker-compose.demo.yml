services:
  app:
    build: .
    environment:
      KNOWLEDGEOPS_DATABASE_URL: postgresql://knowledgeops:local-day5-only@vectors:5432/knowledgeops
    depends_on:
      vectors:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
