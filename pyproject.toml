[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeops-copilot"
description = "Evidence-grounded enterprise knowledge assistant with controlled Agent execution"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.7", "python-multipart==0.0.20", "uvicorn==0.34.3", "httpx==0.28.1", "psycopg[binary]==3.2.10"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
