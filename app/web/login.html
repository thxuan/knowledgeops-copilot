<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KnowledgeOps</title><link rel="icon" href="/workbench/assets/favicon.svg"><link rel="stylesheet" href="/workbench/assets/workbench.css"><link rel="stylesheet" href="/workbench/assets/management.css"><link rel="stylesheet" href="/workbench/assets/app-header.css"><link rel="stylesheet" href="/workbench/assets/ui-theme.css"><style>.account-page,.job-page{max-width:1000px;margin:32px auto;padding:0 20px}.job-card{padding:20px;margin:16px 0}.job-card progress{width:100%}.job-card h2{font-size:17px}.job-card .field-help{overflow-wrap:anywhere}#account-list .panel{padding:20px;margin:12px 0}</style><script type="module" src="/workbench/assets/login.js"></script></head><body><main class="account-page"><h1>登录 KnowledgeOps</h1><p>使用管理员为你创建的账号。</p><form id="login-form" class="panel settings-section"><label class="field">用户名<input id="username" autocomplete="username" maxlength="80" required></label><label class="field">密码<input id="password" type="password" autocomplete="current-password" maxlength="256" required></label><button class="primary-button" type="submit">登录</button></form><p id="login-message" role="status"></p><a href="/">返回工作台</a></main></body></html>
