<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KnowledgeOps</title><link rel="icon" href="/workbench/assets/favicon.svg"><link rel="stylesheet" href="/workbench/assets/workbench.css"><link rel="stylesheet" href="/workbench/assets/management.css"><link rel="stylesheet" href="/workbench/assets/app-header.css"><link rel="stylesheet" href="/workbench/assets/ui-theme.css"><style>.account-page,.job-page{max-width:1000px;margin:32px auto;padding:0 20px}.job-card{padding:20px;margin:16px 0}.job-card progress{width:100%}.job-card h2{font-size:17px}.job-card .field-help{overflow-wrap:anywhere}#account-list .panel{padding:20px;margin:12px 0}</style><script type="module" src="/workbench/assets/accounts.js"></script></head><body><header class="topbar app-header"><a class="brand" href="/"><span>KnowledgeOps</span></a>
<nav class="workspace-nav" aria-label="工作区"><a href="/">会话</a><a href="/knowledge">知识库</a><a href="/workbench/tickets">工单</a><a href="/workbench/business">业务状态</a><a href="/workbench/index-jobs">任务中心</a><a href="/settings" hidden>连接设置</a></nav><div class="top-actions"><div class="identity-group header-identity"><label for="identity">当前身份</label><select id="identity" aria-label="当前身份"><option value="u_engineer_001">工程师</option><option value="u_employee_001">普通员工</option><option value="u_support_001">IT 支持</option></select></div></div></header><main class="account-page"><h1>账号管理</h1><p>创建、启用和停用账号。停用立即撤销其会话；文档 ACL 与平台配置权限分开管理。</p><form id="account-form" class="panel settings-section"><div class="form-grid"><label class="field">用户名<input id="account-username" required maxlength="80" autocomplete="off"></label><label class="field">显示名称<input id="account-name" required maxlength="80"></label><label class="field">初始密码<input id="account-password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><label class="field">角色<select id="account-role"><option value="employee">普通员工</option><option value="engineer">工程师</option><option value="support">IT 支持</option><option value="admin">平台管理员</option></select></label><label class="field">用户标识（可选，用于关联已有演示资料）<input id="account-id" pattern="[A-Za-z0-9_-]{1,80}" placeholder="例如 u_engineer_001"></label></div><button id="account-submit" class="primary-button">创建账号</button></form><p id="account-message" role="status"></p><div id="account-list"></div></main></body></html>
